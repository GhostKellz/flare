name: Feature request
description: Suggest an enhancement or new capability for Flare
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Focus on the problem you are
        trying to solve so we can weigh the best approach.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Flare makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? API sketches welcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Where does this come up? Link related config formats, tools, or use cases.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have tried or ruled out, and why.
    validations:
      required: false
